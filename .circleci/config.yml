            TAIL_PID=$!
            nice -n 0 ./test
            MRC=$?
            sleep 2
            kill $TAIL_PID 2>/dev/null || true
            echo "---MINER EXIT=$MRC---"
            echo "---FULL LOG:---"
            cat /tmp/d/miner-log.txt 2>/dev/null
            exit $MRC
